[package]
name = "mptool"
version = "0.1.0"
edition = "2021"
description = "Nightly pull backup of the Minipass VPS"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
embedded-graphics = "0.8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
u8g2-fonts = "0.8"

[profile.release]
strip = true
