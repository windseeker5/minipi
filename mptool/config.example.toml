# Copy to ~/.config/mptool/config.toml and fill in.
# This file is an example only. The real config holds secrets and never goes into git.

server = "kdresdell@minipass.me"
port = 2222
remote_base = "/home/kdresdell/minipass_env"

# Where the nightly folders go. On the Raspberry Pi: the SSD mount, e.g. "/mnt/ssd/minipass".
backup_root = "~/backups/minipass"

# Discord channel webhook (Server settings > Integrations > Webhooks). Empty = no Discord alert.
discord_webhook = ""

# Also post a short "backup OK" every morning. If that message is missing, the backup did not run.
discord_daily_ok = true

# Customers the "Restore a customer" menu is allowed to touch.
restore_allowed = ["demo"]

# Site monitoring (mptool monitor, every 15 minutes on the Pi). These are the defaults.
# monitor_url = "https://{customer}.minipass.me/login"
# monitor_expect = "type=\"password\""
# monitor_slow_ms = 3000
# monitor_cert_days = 14
# monitor_skip = []

# The little screen's brightness in percent (100 = full colors). Its backlight can't be dimmed,
# so this darkens what is drawn.
# screen_brightness = 70
